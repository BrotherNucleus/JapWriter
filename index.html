<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Practice writing Japanese characters by hand.">
    <title>Japanese Writing Practice</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Japanese writing practice</p>
        <h1 id="page-title">Choose your hiragana</h1>
        <p id="page-intro" class="intro">
          Mark characters you know and characters you want to learn. You can
          change this selection whenever you like.
        </p>
      </header>

      <section id="setup-screen" class="card setup-card" aria-labelledby="setup-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Setup</p>
            <h2 id="setup-title">Character setup</h2>
          </div>
          <p id="selection-status" class="status" role="status"></p>
        </div>

        <div class="legend" aria-label="Character states">
          <span><span class="legend-swatch state-known"></span>Known</span>
          <span><span class="legend-swatch state-learning"></span>Learning</span>
          <span><span class="legend-swatch state-unselected"></span>Not selected</span>
        </div>

        <div id="character-groups" class="character-groups"></div>

        <div class="setup-footer">
          <p id="setup-message" class="status" role="status"></p>
          <button id="start-button" type="button" disabled>Start practice</button>
        </div>
      </section>

      <section id="practice-screen" class="card practice-card" aria-labelledby="practice-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Milestone 4</p>
            <h2 id="practice-title">Write the word</h2>
          </div>
          <button id="back-button" class="secondary-button" type="button">Change selection</button>
        </div>

        <div id="prompt-area" class="prompt-area"></div>
        <p id="practice-status" class="status" role="status"></p>

        <div id="writing-surface" class="writing-surface">
          <canvas
            id="practice-canvas"
            class="practice-canvas"
            aria-label="Write the complete Japanese word"
            width="900"
            height="300"
          ></canvas>
        </div>
        <div class="practice-actions">
          <button id="submit-button" type="button" disabled>Submit word</button>
        </div>

        <div id="feedback-area" class="feedback-area" hidden></div>
        <button id="next-word-button" type="button" hidden>Next word</button>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
