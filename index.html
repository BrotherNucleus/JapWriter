<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Practice writing Japanese characters by hand.">
    <title>Japanese Writing Practice</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Japanese writing practice</p>
        <h1>Write Japanese by hand</h1>
        <p class="intro">
          Choose the hiragana you know and want to learn, then practice writing
          words on a canvas.
        </p>
      </header>

      <section class="card writing-card" aria-labelledby="writing-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Milestone 2</p>
            <h2 id="writing-title">Try the writing canvas</h2>
          </div>
          <p id="canvas-status" class="status" role="status">Ready to write</p>
        </div>

        <div class="canvas-frame">
          <canvas
            id="writing-canvas"
            aria-label="Writing canvas"
            width="800"
            height="480"
          ></canvas>
        </div>

        <div class="canvas-actions">
          <button id="undo-button" type="button" disabled>Undo</button>
          <button id="clear-button" type="button" disabled>Clear</button>
        </div>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
